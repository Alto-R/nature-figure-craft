name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      # Hard errors only: syntax errors, undefined names, invalid comparisons,
      # checked against the oldest supported Python.
      - run: ruff check --select E9,F63,F7,F82 --target-version py39 --output-format github .

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: "3.9" }
          - { os: ubuntu-latest,  python: "3.13" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest,   python: "3.13" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      # The R chord tests skip here; the r job below runs them.
      - run: python -m pytest -v -rs

  r:
    name: R chord diagram
    runs-on: ubuntu-latest
    env:
      REQUIRE_R_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages("circlize")'
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pytest pypdf
      - name: Chord self-test and font-embedding check (regression test for #1)
        run: python -m pytest -v tests/test_chord.py
